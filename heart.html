<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Animation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: #00000033;
    }
  </style>
</head>
<body>
  <canvas id="heartCanvas"></canvas>
  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let particles = [];
    let mouse = { x: null, y: null };
    
    // Heart shape formula
    function heartPos(t) {
      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      return { x, y: -y }; // flip y
    }
    
    class Particle {
      constructor() {
        this.reset();
      }
      
      reset() {
        const t = Math.random() * Math.PI * 2;
        const pos = heartPos(t);
        const scale = Math.min(canvas.width, canvas.height) / 40;
        
        this.x = canvas.width / 2 + pos.x * scale * (0.8 + Math.random() * 0.4);
        this.y = canvas.height / 2 + pos.y * scale * (0.8 + Math.random() * 0.4);
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1;
        this.decay = 0.005 + Math.random() * 0.01;
      }
      
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        
        if (this.life <= 0) this.reset();
      }
      
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 0, 60, ${this.life})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = `rgba(255, 0, 60, ${this.life})`;
        ctx.fill();
      }
    }
    
    // Create particles
    for (let i = 0; i < 300; i++) {
      particles.push(new Particle());
    }
    
    function animate() {
      // Semi-transparent black for trail effect
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    animate();
    
    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
